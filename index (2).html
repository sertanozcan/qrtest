<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Barkod ve QR Okuyucu</title>
<style>
* { box-sizing: border-box; }
body { margin:0; background:#f3f4f6; color:#111827; font-family:system-ui,-apple-system,sans-serif; }
main { max-width:560px; margin:auto; padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
h1 { font-size:24px; margin:0 0 6px; letter-spacing:-.5px; }
p { margin:0 0 18px; color:#4b5563; font-size:14px; }
#reader { width:100%; min-height:210px; overflow:hidden; border-radius:16px; background:#111827; position:relative; }
#reader:empty::before { content:'Kamera kapalı'; position:absolute; inset:0; display:grid; place-items:center; color:#cbd5e1; font-size:14px; }
#reader video { display:block; width:100% !important; }
.controls { display:flex; gap:10px; margin:14px 0; }
button { flex:1; padding:14px 10px; border:0; border-radius:10px; background:#2563eb; color:white; font:600 16px system-ui; min-height:48px; cursor:pointer; }
button.secondary { background:#e5e7eb; color:#111827; }
button:disabled { opacity:.45; cursor:default; }
#status { font-size:14px; color:#4b5563; min-height:22px; margin:0 0 12px; overflow-wrap:anywhere; }
#status.error { color:#b91c1c; }
.result { background:white; border:1px solid #d1d5db; border-radius:14px; padding:18px; }
.result.ok { border-color:#16a34a; }
.label { font-size:12px; font-weight:700; color:#6b7280; letter-spacing:1px; }
#format { font-size:13px; color:#15803d; margin-top:8px; }
#result { margin-top:8px; font-size:26px; font-weight:650; overflow-wrap:anywhere; white-space:pre-wrap; user-select:text; }
#copy { margin-top:16px; width:100%; font-size:14px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
<main>
<h1>Barkod ve QR Okuyucu</h1>
<p>Arka kamerayı aç ve kodu kameraya göster.</p>
<div id="reader" aria-label="Kamera görüntüsü"></div>
<div class="controls">
<button id="start">Kamerayı aç</button>
<button id="stop" class="secondary" disabled>Kapat</button>
</div>
<div id="status" role="status">Kamera açılmayı bekliyor.</div>
<section class="result" id="resultBox">
<div class="label">OKUNAN KOD</div>
<div id="format"></div>
<div id="result" aria-live="polite">—</div>
<button id="copy" class="secondary" disabled>Kodu kopyala</button>
</section>
</main>
<script>
'use strict';
const start = document.getElementById('start');
const stop = document.getElementById('stop');
const status = document.getElementById('status');
const result = document.getElementById('result');
const format = document.getElementById('format');
const copy = document.getElementById('copy');
const resultBox = document.getElementById('resultBox');
let scanner = null, busy = false, running = false, value = null;
let lastFormat = '';
function message(text, error = false) {
  status.textContent = text;
  status.classList.toggle('error', error);
}
function buttons() {
  start.disabled = busy || running;
  stop.disabled = busy || !running;
}
function decoded(text, details) {
  const kind = details?.result?.format?.formatName || 'Barkod / QR';
  if (value === text && lastFormat === kind) return;
  value = text;
  lastFormat = kind;
  result.textContent = text;
  format.textContent = kind;
  resultBox.classList.add('ok');
  copy.disabled = false;
  message('Kod okundu. Sıradaki kodu okutabilirsin.');
}
start.addEventListener('click', async () => {
  if (busy || running) return;
  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
    message('Kamera erişimi için sayfayı HTTPS üzerinden Safari veya Chrome ile aç.', true); return;
  }
  if (typeof Html5Qrcode === 'undefined') {
    message('Okuyucu kütüphanesi yüklenemedi. İnternet bağlantını kontrol edip sayfayı yenile.', true); return;
  }
  busy = true; buttons(); message('Kamera açılıyor. İzin istenirse onayla.');
  try {
    scanner = scanner || new Html5Qrcode('reader', { verbose: false });
    // Scan the whole frame to support both wide 1D barcodes and square QR codes.
    await scanner.start({ facingMode: 'environment' }, { fps: 10 }, decoded, () => {});
    running = true;
    message('Kamera açık. Barkodu veya QR kodu göster.');
  } catch (err) {
    running = false;
    try { scanner?.clear(); } catch (_) {}
    const detail = String(err?.message || err);
    message('Kamera açılamadı. Safari kamera iznini ve diğer uygulamaları kontrol et. (' + detail + ')', true);
  } finally { busy = false; buttons(); }
});
async function closeCamera() {
  if (busy || !running || !scanner) return;
  busy = true; buttons();
  try {
    await scanner.stop();
    running = false;
    scanner.clear();
    message('Kamera kapalı. Son okunan kod ekranda kalır.');
  } catch (err) { message('Kamera kapatılamadı: ' + String(err?.message || err), true); }
  finally { busy = false; buttons(); }
}
stop.addEventListener('click', closeCamera);
window.addEventListener('pagehide', () => {
  // Release camera tracks even when the user leaves the page.
  document.querySelectorAll('#reader video').forEach(v => {
    v.srcObject?.getTracks().forEach(t => t.stop());
  });
  if (running) void closeCamera();
});
copy.addEventListener('click', async () => {
  if (value === null) return;
  try { await navigator.clipboard.writeText(value); message('Kod kopyalandı.'); }
  catch (_) { message('Otomatik kopyalama yapılamadı. Kodun üzerine basılı tutarak kopyala.', true); }
});
</script>
</body>
</html>
